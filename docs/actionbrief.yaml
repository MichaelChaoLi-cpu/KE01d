analysisStructureBrief:
  overview: A descriptive spatial planning chain links reported outages to bounded resident and separate shelter
    demand, network access, required capacity, capacity-first resident allocation, marginal tanker returns, and
    targeted stress screening. Findings are conditional on declared assumptions and do not describe causal effects
    or realized operations.
  levels:
  - levelName: Evidence and linkage audit
    levelAim: Establish analytical coverage without silent record loss.
    inputs:
    - Reporting-Unit Municipality Match Status
    - Population-Mesh Spatial Join Status
    - Facility Location Resolution Status
    - Network Snap Acceptance Indicator
    - Road Edge Match Status
    modelOrMethod: Deterministic exact-name and spatial linkage rules retain unmatched denominators; facility and
      demand connectors are accepted within 250 m.
    outputs:
    - Data Linkage and Coverage Audit
    interpretation: Linkage coverage does not prove operational availability, capacity, staffing, or observed accessibility.
  - levelName: Resident and shelter demand
    levelAim: Translate reported outages and evacuees into bounded daily water requirements.
    inputs:
    - Current Reported Outage Households
    - Municipality Total Household Count
    - Total Resident Population
    - Per-Capita Emergency Water Demand
    - Evacuee Person Count
    modelOrMethod: Resident demand is \(D_{g,s,q}=N_{g,s}^{out}q\) and municipal demand is \(D_{m,s,q}^{resident}=\sum_{g\in\mathcal{G}_m}D_{g,s,q}\).
      Shelter demand is \(D_{h,q}^{shelter}=N_h^{evac}q\).
    outputs:
    - Outage Population and Emergency Water Demand
    - Municipality Outage Population and Water Demand
    - Required Water Volume and Tanker Workload
    interpretation: Population values are planning bounds, not confidence intervals. Shelter and resident demand
      remain separate.
  - levelName: Nominal network accessibility
    levelAim: Measure coverage sensitivity for residents, older residents, and shelter evacuees.
    inputs:
    - Estimated Population Affected by Outage
    - Population Aged 65 Years or Older
    - Evacuee Person Count
    - Road Edge Length in Metres
    modelOrMethod: Shortest distance is \(d_{uj}^{r}=\min_{\pi\in\mathcal{P}_{uj}^{r}}\sum_{e\in\pi}l_e\). Weighted
      coverage \(C_{x,a,r,o}\) counts population with a nearest eligible point within threshold \(a\).
    outputs:
    - Announced Water Points and Nominal Access Coverage
    - Accessibility Coverage by Distance Threshold
    - Announced Water-Point Coverage under Alternative Access Distances
    - Municipality Accessibility and Priority Gaps
    interpretation: Road-network distance is a proxy; 250 to 5,000 m thresholds are assumptions, not walking standards.
  - levelName: Tanker workload and required capacity
    levelAim: Convert point-assigned demand into trips and tanker-day capacity.
    inputs:
    - Estimated Resident Emergency Water Demand
    - Estimated Shelter Emergency Water Demand
    - Baseline Road Edge Travel Time
    - Scenario Parameter Value
    modelOrMethod: Feasible trips are \(K_{bfj}=\min\{K^{limit},\max[0,\lfloor(60W-2t_{bf})/(2t_{fj}+t^{load}+t^{unload})\rfloor]\}\);
      required tankers are \(n_j^{required}=\lceil Q_j/(cK_{bfj})\rceil\).
    outputs:
    - Required Water Volume and Tanker Workload
    - Water-Point Capacity and Tanker Requirements
    interpretation: These are required capacities under assumptions; historical refill capacity is not verified
      2026 capacity.
  - levelName: Capacity-first resident allocation
    levelAim: Allocate a pooled fleet and select distribution sites while minimizing unmet resident water.
    inputs:
    - Candidate Staging Site Identifier
    - Candidate Dispatch Base Indicator
    - Historical Water Treatment Facility Name
    - Estimated Resident Emergency Water Demand
    - Fleet Size
    modelOrMethod: The model uses \(\operatorname{lexmin}(U^{resident},V^{used},K^{trips},Z^{temporary})\) subject
      to demand balance, access, trip, work-time, and fleet constraints with \(W^{alloc}=10\) hours/day.
    outputs:
    - Scenario-Based Tanker and Temporary Water-Point Allocation
    - Scenario-Based Priority Deployment List
    interpretation: Only resident demand is optimized. Shelter results remain descriptive, and the plan is not a
      dispatch-ready schedule.
  - levelName: Marginal tanker returns
    levelAim: Measure how unmet water and protection change as fleet size rises.
    inputs:
    - Estimated Population Affected by Outage
    - Estimated Resident Emergency Water Demand
    - Fleet Size
    - General Access Distance
    modelOrMethod: Protected share is \(P_n(\omega)\), unmet water is \(U_n(\omega)=\sum_gU_g\), and marginal gain
      is \(\Delta P_n(\omega)=P_n(\omega)-P_{n^-}(\omega)\); all nonzero points are validated and independently
      rerun.
    outputs:
    - Marginal Protection Gains from Additional Tankers
    interpretation: Returns are conditional scenario results and do not establish superiority over unimplemented
      allocation baselines.
  - levelName: Stress screening and synthesis
    levelAim: Test sensitivity and reconcile the demand-access-capacity-allocation-gap chain.
    inputs:
    - Affected-Population Scenario
    - Per-Capita Water-Demand Scenario
    - Fleet Size
    - Road Edge Match Status
    - Scenario Parameter Level
    modelOrMethod: Screened capacity is \(B_{n,r,o}^{screen}=ncK_{r,o}^{screen}\); deterministic whole-mesh packing
      is evaluated over 162 population, demand, fleet, road, and point-state combinations.
    outputs:
    - Scenario Performance and Robustness
    - Full-Factorial Scenario Performance and Robustness Appendix
    - All planned figures and tables
    interpretation: This is a targeted feasibility screen, not exhaustive worst-case optimization or observed operations;
      negligible packing artifacts require disclosure.
