doc_type: actionbrief
version: 1.0.0
datasetDictionary:
  P21-12_43_GML.zip::P21-12a_43:
    datasetSourceName: P21-12_43_GML.zip::P21-12a_43.shp
    datasetDescription: Historical water-supply-area polygons used only for service context and capacity sensitivity.
    datasetAttribute: shapefile
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT), National Land Numerical Information
    datasetGenerationInfo: Official MLIT P21 layer extracted for Kumamoto Prefecture with source reference and edition
      years retained.
    datasetPeriod: 2010 reference year; 2012 dataset edition
    datasetScale: 385 historical water-supply-area records
    datasetSpatialResolution: Water-supply-area polygon
    datasetTemporalResolution: Single historical cross-section
    datasetPreprocessingInfo: Decoded source text, assigned readable fields, standardized geometry to EPSG:6668,
      treated zero capacity as missing, and flagged capacity as historical only.
  P21-12_43_GML.zip::P21-12b_43:
    datasetSourceName: P21-12_43_GML.zip::P21-12b_43.shp
    datasetDescription: Historical water-treatment-facility points used as candidate tanker refill locations.
    datasetAttribute: shapefile
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT), National Land Numerical Information
    datasetGenerationInfo: Official MLIT P21 layer extracted for Kumamoto Prefecture with source reference and edition
      years retained.
    datasetPeriod: 2010 reference year; 2012 dataset edition
    datasetScale: 153 historical treatment-facility records
    datasetSpatialResolution: Water-treatment-facility point
    datasetTemporalResolution: Single historical cross-section
    datasetPreprocessingInfo: Decoded source text, assigned readable fields, standardized geometry to EPSG:6668,
      treated zero capacity as missing, and flagged capacity as historical only.
  derived:emergency_water_points_network_access:
    datasetSourceName: derived:emergency_water_points_network_access
    datasetDescription: Announced emergency water points with resolved coordinates and accepted road-network connectors.
    datasetAttribute: table
    datasetProvider: Authors, derived from official municipal emergency notices and mapped facility sources
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: 2026-07-29 to 2026-08-08
    datasetScale: 36 announced water points
    datasetSpatialResolution: Individual facility point
    datasetTemporalResolution: Latest applicable event schedule per point
    datasetPreprocessingInfo: Standardized geometry to EPSG:6668, retained accepted and rejected connectors, and
      did not infer operational availability.
  derived:emergency_water_scenario_parameters:
    datasetSourceName: derived:emergency_water_scenario_parameters
    datasetDescription: Official-reference and researcher-defined assumptions for demand, access, fleet, and operations.
    datasetAttribute: table
    datasetProvider: Authors, with cited official references where available
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: 2026 planning analysis
    datasetScale: 37 parameter-level records
    datasetSpatialResolution: Study-level scenario parameter
    datasetTemporalResolution: Static scenario design
    datasetPreprocessingInfo: Applied the documented deterministic rules, retained unmatched records and uncertainty
      states, and avoided unsupported imputation.
  derived:kumamoto_reporting_municipalities:
    datasetSourceName: derived:kumamoto_reporting_municipalities
    datasetDescription: Municipality polygons used for outage reporting and output aggregation.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT N03 administrative areas
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: 2025-01-01 boundary reference
    datasetScale: 45 reporting municipalities
    datasetSpatialResolution: Municipality polygon
    datasetTemporalResolution: Single boundary reference date
    datasetPreprocessingInfo: Applied the documented deterministic rules, retained unmatched records and uncertainty
      states, and avoided unsupported imputation.
  derived:municipality_outage_demand_scenarios:
    datasetSourceName: derived:municipality_outage_demand_scenarios
    datasetDescription: Municipality-level outage observations, population bounds, and water-demand scenarios.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT situation reports and 2020 census meshes
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: Current outage state at 2026-08-08 07:30 JST
    datasetScale: 414 municipality-scenario records
    datasetSpatialResolution: Municipality by outage-population and demand scenario
    datasetTemporalResolution: Single event snapshot with nine scenario combinations
    datasetPreprocessingInfo: Applied the documented deterministic rules, retained unmatched records and uncertainty
      states, and avoided unsupported imputation.
  derived:population_mesh_outage_demand_scenarios:
    datasetSourceName: derived:population_mesh_outage_demand_scenarios
    datasetDescription: Small-area resident outage-population bounds and daily emergency-water demand scenarios.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT outage reports and Statistics Bureau census meshes
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: 2020 census population under the 2026-08-08 outage snapshot
    datasetScale: 566,505 mesh-scenario records
    datasetSpatialResolution: 125 m population mesh by nine scenario combinations
    datasetTemporalResolution: Single event snapshot with scenario variation
    datasetPreprocessingInfo: Retained native census support and disclosure status, standardized geometry to EPSG:6668,
      and did not duplicate suppressed group values across fine meshes.
  derived:reporting_unit_municipality_crosswalk:
    datasetSourceName: derived:reporting_unit_municipality_crosswalk
    datasetDescription: Explicit linkage between official outage-reporting units and the Kumamoto study geography.
    datasetAttribute: table
    datasetProvider: Authors
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: 2026 event reporting structure
    datasetScale: 19 reporting-unit records
    datasetSpatialResolution: Reporting unit
    datasetTemporalResolution: Static event crosswalk
    datasetPreprocessingInfo: Applied the documented deterministic rules, retained unmatched records and uncertainty
      states, and avoided unsupported imputation.
  derived:road_restriction_edge_matches:
    datasetSourceName: derived:road_restriction_edge_matches
    datasetDescription: Candidate links between reported road restrictions and routable road edges.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT restriction observations and the MLIT-based road network
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: 2026-07-29 to 2026-08-07
    datasetScale: 98,884 candidate-edge rows representing 680 restriction observations
    datasetSpatialResolution: Restriction observation by candidate road edge
    datasetTemporalResolution: Repeated event snapshots
    datasetPreprocessingInfo: Standardized readable fields and geometry, retained unmatched or disconnected records,
      and treated availability and travel impedance as scenario inputs.
  derived:shelter_water_demand_network_access:
    datasetSourceName: derived:shelter_water_demand_network_access
    datasetDescription: Current public shelters with evacuee water demand, utility status, resolved locations, and
      network access.
    datasetAttribute: table
    datasetProvider: Authors, derived from Yatsushiro City reports and official evacuation-facility coordinates
    datasetGenerationInfo: Constructed by this study from declared source layers using deterministic linkage, aggregation,
      or scenario rules.
    datasetPeriod: Shelter snapshot at 2026-08-06 18:00 JST
    datasetScale: 123 records representing 41 shelters across three demand levels
    datasetSpatialResolution: Individual shelter point by demand scenario
    datasetTemporalResolution: Single event snapshot with scenario variation
    datasetPreprocessingInfo: Standardized geometry to EPSG:6668, retained accepted and rejected connectors, and
      did not infer operational availability.
  emergency_water_points:
    datasetSourceName: emergency_water_points.csv
    datasetDescription: Officially announced emergency water-point names, schedules, allocation limits, and status
      metadata.
    datasetAttribute: table
    datasetProvider: Yatsushiro City, Uki City, and Hikawa Town official emergency notices
    datasetGenerationInfo: Extracted from official event records with source URL, retrieval time, and record-level
      provenance retained.
    datasetPeriod: 2026-07-29 to 2026-08-08
    datasetScale: 36 announced water points
    datasetSpatialResolution: Individual announced facility
    datasetTemporalResolution: Event schedule snapshot
    datasetPreprocessingInfo: Assigned readable English variables, parsed declared numeric and time fields, preserved
      missing values, and retained provenance.
  kumamoto_administrative_areas_preprocessed:
    datasetSourceName: kumamoto_administrative_areas_preprocessed.parquet
    datasetDescription: Municipality and designated-city ward polygons used for spatial linkage and map context.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT), National Land Numerical Information
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2025-01-01 boundary reference
    datasetScale: 49 municipality or ward records
    datasetSpatialResolution: Municipality or ward polygon
    datasetTemporalResolution: Single boundary reference date
    datasetPreprocessingInfo: Assigned readable English variables, parsed declared numeric and time fields, preserved
      missing values, and retained provenance.
  kumamoto_dispatch_base_network_access_preprocessed:
    datasetSourceName: kumamoto_dispatch_base_network_access_preprocessed.parquet
    datasetDescription: Historical fire facilities screened as candidate tanker dispatch bases and linked to the
      road network.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT P17 fire facilities and the MLIT-based road network
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2012 facility roster with 2024 network linkage
    datasetScale: 81 candidate dispatch-base records
    datasetSpatialResolution: Individual fire-facility point
    datasetTemporalResolution: Static historical candidate layer
    datasetPreprocessingInfo: Standardized geometry to EPSG:6668, retained accepted and rejected connectors, and
      did not infer operational availability.
  kumamoto_fire_stations_2012_preprocessed:
    datasetSourceName: kumamoto_fire_stations_2012_preprocessed.parquet
    datasetDescription: Historical fire stations, branches, and outposts used to define possible tanker dispatch
      bases.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT), National Land Numerical Information
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2012 reference
    datasetScale: 94 fire facilities, including 81 candidate bases
    datasetSpatialResolution: Fire-facility point
    datasetTemporalResolution: Single historical cross-section
    datasetPreprocessingInfo: Assigned readable English variables, parsed declared numeric and time fields, preserved
      missing values, and retained provenance.
  kumamoto_population_disclosure_groups_preprocessed:
    datasetSourceName: kumamoto_population_disclosure_groups_preprocessed.parquet
    datasetDescription: Disclosure-group population, older-age, and household totals used where fine cells are aggregated.
    datasetAttribute: table
    datasetProvider: Statistics Bureau of Japan / e-Stat
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2020 Population Census
    datasetScale: 36,657 disclosure-group records
    datasetSpatialResolution: Census disclosure group linked to 125 m cells
    datasetTemporalResolution: Single census reference year
    datasetPreprocessingInfo: Retained native census support and disclosure status, standardized geometry to EPSG:6668,
      and did not duplicate suppressed group values across fine meshes.
  kumamoto_population_group_network_access_preprocessed:
    datasetSourceName: kumamoto_population_group_network_access_preprocessed.parquet
    datasetDescription: Disclosure-group population records with representative road-network connectors for older-resident
      access.
    datasetAttribute: table
    datasetProvider: Authors, derived from census groups and the MLIT-based road network
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2020 census population with 2024 network linkage
    datasetScale: 36,657 disclosure-group access records
    datasetSpatialResolution: Census disclosure group
    datasetTemporalResolution: Static cross-sectional linkage
    datasetPreprocessingInfo: Standardized geometry to EPSG:6668, retained accepted and rejected connectors, and
      did not infer operational availability.
  kumamoto_population_mesh_125m_preprocessed:
    datasetSourceName: kumamoto_population_mesh_125m_preprocessed.parquet
    datasetDescription: Population, household, and disclosure attributes for the populated 125 m analysis grid.
    datasetAttribute: table
    datasetProvider: Statistics Bureau of Japan / e-Stat
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2020 Population Census
    datasetScale: 62,945 populated meshes
    datasetSpatialResolution: 125 m population mesh
    datasetTemporalResolution: Single census reference year
    datasetPreprocessingInfo: Retained native census support and disclosure status, standardized geometry to EPSG:6668,
      and did not duplicate suppressed group values across fine meshes.
  kumamoto_population_mesh_network_access_preprocessed:
    datasetSourceName: kumamoto_population_mesh_network_access_preprocessed.parquet
    datasetDescription: Population-mesh records linked to the routable road network for distance and allocation
      analysis.
    datasetAttribute: table
    datasetProvider: Authors, derived from census meshes and the MLIT-based road network
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2020 census population with 2024 network linkage
    datasetScale: 62,945 mesh access records
    datasetSpatialResolution: 125 m population mesh
    datasetTemporalResolution: Static cross-sectional linkage
    datasetPreprocessingInfo: Standardized geometry to EPSG:6668, retained accepted and rejected connectors, and
      did not infer operational availability.
  kumamoto_routable_road_edges_preprocessed:
    datasetSourceName: kumamoto_routable_road_edges_preprocessed.parquet
    datasetDescription: Grade-aware routable road edges with length, speed, travel time, hazard, and route attributes.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT N13 road centerlines
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2024 source network with contextual overlays
    datasetScale: 390,234 routable road edges
    datasetSpatialResolution: Routable road edge
    datasetTemporalResolution: Static baseline network
    datasetPreprocessingInfo: Standardized readable fields and geometry, retained unmatched or disconnected records,
      and treated availability and travel impedance as scenario inputs.
  kumamoto_routable_road_nodes_preprocessed:
    datasetSourceName: kumamoto_routable_road_nodes_preprocessed.parquet
    datasetDescription: Road nodes defining topology for shortest-path distance and travel-time calculations.
    datasetAttribute: table
    datasetProvider: Authors, derived from MLIT N13 road centerlines
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: 2024 source network
    datasetScale: 314,391 routable road nodes
    datasetSpatialResolution: Road-network node
    datasetTemporalResolution: Static baseline network
    datasetPreprocessingInfo: Standardized readable fields and geometry, retained unmatched or disconnected records,
      and treated availability and travel impedance as scenario inputs.
  outage_tanker_snapshots:
    datasetSourceName: outage_tanker_snapshots.csv
    datasetDescription: Official observations of outage households, damage status, and reported tanker deployments.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT)
    datasetGenerationInfo: Extracted from official event records with source URL, retrieval time, and record-level
      provenance retained.
    datasetPeriod: 2026-07-29 to 2026-08-08
    datasetScale: 546 reporting-unit records from 31 report snapshots
    datasetSpatialResolution: Reporting unit by situation-report snapshot
    datasetTemporalResolution: Irregular event-report updates
    datasetPreprocessingInfo: Assigned readable English variables, parsed declared numeric and time fields, preserved
      missing values, and retained provenance.
  road_restrictions:
    datasetSourceName: road_restrictions.csv
    datasetDescription: Timestamped road restrictions with status, cause, geometry, detour, and isolation attributes.
    datasetAttribute: table
    datasetProvider: Ministry of Land, Infrastructure, Transport and Tourism (MLIT) emergency road-information layers
    datasetGenerationInfo: Extracted from official event records with source URL, retrieval time, and record-level
      provenance retained.
    datasetPeriod: 2026-07-29 to 2026-08-07
    datasetScale: 680 road-restriction observations
    datasetSpatialResolution: Reported restricted segment or point by snapshot
    datasetTemporalResolution: Repeated event snapshots
    datasetPreprocessingInfo: Standardized readable fields and geometry, retained unmatched or disconnected records,
      and treated availability and travel impedance as scenario inputs.
  shelters_current:
    datasetSourceName: shelters_current.csv
    datasetDescription: Current shelter occupancy, water, electricity, air-conditioning, and sanitation status.
    datasetAttribute: table
    datasetProvider: Yatsushiro City official shelter status report
    datasetGenerationInfo: Extracted from official event records with source URL, retrieval time, and record-level
      provenance retained.
    datasetPeriod: Snapshot at 2026-08-06 18:00 JST
    datasetScale: 41 current public shelters
    datasetSpatialResolution: Individual shelter facility
    datasetTemporalResolution: Single event snapshot
    datasetPreprocessingInfo: Assigned readable English variables, parsed declared numeric and time fields, preserved
      missing values, and retained provenance.
  staging_site_candidates:
    datasetSourceName: staging_site_candidates.parquet
    datasetDescription: Mapped public and emergency facilities screened as candidate temporary water-distribution
      locations.
    datasetAttribute: table
    datasetProvider: Authors, compiled from MLIT, e-Stat, and official evacuation-facility layers
    datasetGenerationInfo: Copied immutably from an audited upstream preprocessing output and restricted to the
      approved analysis variables.
    datasetPeriod: Mixed pre-event reference vintages through 2024
    datasetScale: 6,105 candidate sites
    datasetSpatialResolution: Individual mapped facility point
    datasetTemporalResolution: Static candidate inventory
    datasetPreprocessingInfo: Reprojected to EPSG:6668, retained 159 unmatched candidates, removed prior-study outcomes,
      and treated screening only as candidate eligibility.
variableDictionary:
  municipality:
    variableNameInDataset: Municipality
    variableNameInArticle: Municipality
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Municipal jurisdiction associated with a record. Construction: Trimmed source label; encoded
      as a category.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  water_point_name:
    variableNameInDataset: Water Point Name
    variableNameInArticle: Emergency Water Point Name
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Named location where emergency water is distributed. Construction: Trimmed official facility
      label.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  valid_from_date:
    variableNameInDataset: Valid From Date
    variableNameInArticle: Water Point Validity Start Date
    variableAttribute: categorical
    variableUnit: calendar date
    variableDescription: 'First calendar date on which the announced operating schedule applies. Construction: Parsed
      as a calendar date.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  valid_to_date:
    variableNameInDataset: Valid To Date
    variableNameInArticle: Water Point Validity End Date
    variableAttribute: categorical
    variableUnit: calendar date
    variableDescription: 'Last calendar date on which the announced operating schedule applies. Construction: Parsed
      as a calendar date.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 28
  opening_time:
    variableNameInDataset: Opening Time
    variableNameInArticle: Water Point Opening Time
    variableAttribute: other
    variableUnit: local HH:MM
    variableDescription: 'Daily announced opening time. Construction: Preserved as local `HH:MM` text.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  closing_time:
    variableNameInDataset: Closing Time
    variableNameInArticle: Water Point Closing Time
    variableAttribute: other
    variableUnit: local HH:MM
    variableDescription: 'Daily announced closing time. Construction: Preserved as local `HH:MM` text.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  allocation_basis:
    variableNameInDataset: Allocation Basis
    variableNameInArticle: Water Allocation Basis
    variableAttribute: other
    variableUnit: unitless
    variableDescription: 'Unit to which the announced allocation limit applies. Construction: Trimmed source label;
      encoded as a category.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  allocation_limit_l:
    variableNameInDataset: Allocation Limit (L)
    variableNameInArticle: Water Allocation Limit in Liters
    variableAttribute: continuous
    variableUnit: L/allocation unit
    variableDescription: '\(q_j^{limit}\), the announced maximum liters distributed per allocation unit at point
      \(j\). Construction: Parsed as numeric liters; missing values are not imputed.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  water_type:
    variableNameInDataset: Water Type
    variableNameInArticle: Distributed Water Type
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Reported type or intended use of distributed water. Construction: Trimmed source label;
      encoded as a category.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  source_status_time:
    variableNameInDataset: Source Status Time
    variableNameInArticle: Water Point Status Timestamp
    variableAttribute: categorical
    variableUnit: Asia/Tokyo datetime
    variableDescription: 'Timestamp at which the announced water-point status applies. Construction: Parsed and
      normalized to Asia/Tokyo.'
    variableSource: derived:emergency_water_points_network_access
    observationNumber: 36
  latitude:
    variableNameInDataset: Latitude
    variableNameInArticle: Facility Latitude
    variableAttribute: continuous
    variableUnit: decimal degrees
    variableDescription: 'Geographic latitude in decimal degrees. Construction: Retained from an accepted event
      coordinate or filled by the documented municipality-specific exact-match source hierarchy; otherwise missing.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  longitude:
    variableNameInDataset: Longitude
    variableNameInArticle: Facility Longitude
    variableAttribute: continuous
    variableUnit: decimal degrees
    variableDescription: 'Geographic longitude in decimal degrees. Construction: Retained from an accepted event
      coordinate or filled by the documented municipality-specific exact-match source hierarchy; otherwise missing.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  location_resolution_status:
    variableNameInDataset: Location Resolution Status
    variableNameInArticle: Facility Location Resolution Status
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Indicates whether coordinates were resolved by the accepted deterministic linkage rule.
      Construction: Distinguishes accepted event coordinates, exact historical matches, unique exact candidate matches,
      current official designated-shelter matches, current official emergency-evacuation-site matches, announcement-linked
      support-map matches, and unresolved records; no fuzzy matches are accepted.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  shelter_number:
    variableNameInDataset: Shelter Number
    variableNameInArticle: Shelter Sequence Number
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Official sequence number within the shelter status list. Construction: Parsed as a nullable
      integer.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  shelter_name:
    variableNameInDataset: Shelter Name
    variableNameInArticle: Shelter Facility Name
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Named public shelter facility. Construction: Trimmed official facility label.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  district:
    variableNameInDataset: District
    variableNameInArticle: Shelter District
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Local district associated with a shelter. Construction: Trimmed source label; encoded
      as a category.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  maximum_capacity:
    variableNameInDataset: Maximum Capacity
    variableNameInArticle: Maximum Shelter Capacity
    variableAttribute: count
    variableUnit: persons
    variableDescription: '\(C_j\), the reported maximum number of people that shelter \(j\) can accommodate. Construction:
      Parsed as a nullable integer; missing values are not imputed.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  evacuee_households:
    variableNameInDataset: Evacuee Households
    variableNameInArticle: Evacuee Household Count
    variableAttribute: count
    variableUnit: households
    variableDescription: '\(H_j^{evac}\), households reported at shelter \(j\) at the snapshot time. Construction:
      Parsed as a nullable integer; missing values are not imputed.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  evacuee_people:
    variableNameInDataset: Evacuee People
    variableNameInArticle: Evacuee Person Count
    variableAttribute: count
    variableUnit: persons
    variableDescription: '\(N_j^{evac}\), people reported at shelter \(j\) at the snapshot time. Construction: Parsed
      as a nullable integer; missing values are not imputed.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  water_status:
    variableNameInDataset: Water Status
    variableNameInArticle: Shelter Water Availability Status
    variableAttribute: categorical
    variableUnit: unitless
    variableDescription: 'Reported availability of water at a shelter. Construction: Symbols recoded as `available`,
      `partially available`, or `unavailable`.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  electricity_status:
    variableNameInDataset: Electricity Status
    variableNameInArticle: Shelter Electricity Availability Status
    variableAttribute: categorical
    variableUnit: unitless
    variableDescription: 'Reported availability of electricity at a shelter. Construction: Symbols recoded as `available`,
      `partially available`, or `unavailable`.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  air_conditioning_status:
    variableNameInDataset: Air Conditioning Status
    variableNameInArticle: Shelter Air Conditioning Availability Status
    variableAttribute: categorical
    variableUnit: unitless
    variableDescription: 'Reported availability of air conditioning at a shelter. Construction: Symbols recoded
      as `available`, `partially available`, or `unavailable`.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  toilet_count:
    variableNameInDataset: Toilet Count
    variableNameInArticle: Fixed Toilet Count
    variableAttribute: count
    variableUnit: units
    variableDescription: 'Number of reported fixed toilets at a shelter. Construction: Parsed as a nullable integer;
      missing values are not imputed.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  portable_toilet_count:
    variableNameInDataset: Portable Toilet Count
    variableNameInArticle: Portable Toilet Count
    variableAttribute: count
    variableUnit: units
    variableDescription: 'Number of reported portable toilets at a shelter. Construction: Parsed as a nullable integer;
      missing values are not imputed.'
    variableSource: derived:shelter_water_demand_network_access
    observationNumber: 123
  snapshot_time:
    variableNameInDataset: Snapshot Time
    variableNameInArticle: Observation Snapshot Timestamp
    variableAttribute: categorical
    variableUnit: Asia/Tokyo datetime
    variableDescription: 'Timestamp identifying the state represented by a shelter or road observation. Construction:
      Parsed and normalized to Asia/Tokyo.'
    variableSource: derived:road_restriction_edge_matches
    observationNumber: 98884
  report_number:
    variableNameInDataset: Report Number
    variableNameInArticle: MLIT Situation Report Number
    variableAttribute: categorical
    variableUnit: text, code, category, or indicator
    variableDescription: 'Sequential number of the official situation report. Construction: Parsed as a nullable
      integer.'
    variableSource: derived:municipality_outage_demand_scenarios
    observationNumber: 135
  report_timestamp:
    variableNameInDataset: report_timestamp
    variableNameInArticle: Situation Report Timestamp
    variableAttribute: categorical
    variableUnit: Asia/Tokyo datetime
    variableDescription: 'Official issue timestamp of the situation report. Construction: Parsed and normalized
      to Asia/Tokyo.'
    variableSource: outage_tanker_snapshots
    observationNumber: 546
  water_status_timestamp:
    variableNameInDataset: Water Status Timestamp
