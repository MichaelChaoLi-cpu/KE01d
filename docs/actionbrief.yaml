figureDictionary:
  fig_outage_population_and_emergency_water_demand:
    figureId: fig_outage_population_and_emergency_water_demand
    figurePath: data/results/figures/Figure_outage_population_and_emergency_water_demand.png
    figureCaption: Outage population and emergency water demand across planning bounds
    figureAim: Maps affected-population estimates and emergency-water demand at mesh and municipality support under
      the lower, central, and upper planning bounds, addressing the demand component of the research objective.
    figureExplanation: Shows where affected-population estimates concentrate and converts the central estimate to
      minimum daily demand. Values are scenario allocations, not household confirmations.
    figureSuitableSection: 'Results: outage demand'
  fig_announced_water_points_and_nominal_access_coverage:
    figureId: fig_announced_water_points_and_nominal_access_coverage
    figurePath: data/results/figures/Figure_announced_water_points_and_nominal_access_coverage.png
    figureCaption: Announced water points and nominal resident access coverage
    figureAim: Maps resolved announced water points, affected demand, and nominal network coverage while explicitly
      representing unresolved-location sensitivity.
    figureExplanation: Locates all 36 resolved points and classifies affected meshes by nearest network distance.
      It does not measure actual walking, queues, or capacity.
    figureSuitableSection: 'Results: nominal accessibility'
  fig_accessibility_coverage_by_distance_threshold:
    figureId: fig_accessibility_coverage_by_distance_threshold
    figurePath: data/results/figures/Figure_accessibility_coverage_by_distance_threshold.png
    figureCaption: Network access coverage across five distance thresholds
    figureAim: Compares cumulative coverage of affected residents, older residents, and shelter evacuees across
      the approved access-distance thresholds.
    figureExplanation: Compares cumulative coverage for affected residents, older residents, and shelter evacuees.
      Thresholds are sensitivity settings rather than observed behavior.
    figureSuitableSection: 'Results: population accessibility'
  fig_required_water_volume_and_tanker_workload:
    figureId: fig_required_water_volume_and_tanker_workload
    figurePath: data/results/figures/Figure_required_water_volume_and_tanker_workload.png
    figureCaption: Emergency water volumes and route-constrained tanker workload
    figureAim: Compares required daily water volume and tanker workload across demand, vehicle-capacity, trip-count,
      service-time, and work-hour assumptions.
    figureExplanation: Separates resident and shelter volumes and varies operational assumptions. Results are required
      capacity, not observed supply deficits.
    figureSuitableSection: 'Results: capacity requirements'
  fig_scenario_based_tanker_and_temporary_water_point_allocation:
    figureId: fig_scenario_based_tanker_and_temporary_water_point_allocation
    figurePath: data/results/figures/Figure_scenario_based_tanker_and_temporary_water_point_allocation.png
    figureCaption: Resident tanker allocation across three service catchments
    figureAim: Maps tanker bases, historical refill candidates, selected temporary water points, fleet gaps, and
      service areas under matched 500, 1,000, and 2,000 m allocation-catchment scenarios, with road and operational
      settings held fixed.
    figureExplanation: Maps capacity-first resident allocations for 500, 1,000, and 2,000 m catchments with ten
      tankers. The output is an aggregate scenario, not a dispatch-ready schedule.
    figureSuitableSection: 'Results: resident allocation'
  fig_marginal_protection_gains_from_additional_tankers:
    figureId: fig_marginal_protection_gains_from_additional_tankers
    figurePath: data/results/figures/Figure_marginal_protection_gains_from_additional_tankers.png
    figureCaption: Marginal protection gains from additional tanker capacity
    figureAim: Compares remaining unmet minimum water and interval-average protected-population gains as the fleet
      expands under matched 500, 1,000, and 2,000 m allocation catchments.
    figureExplanation: Shows unmet minimum water and average marginal protection for three catchments. All twelve
      nonzero points passed validation and independent reruns.
    figureSuitableSection: 'Results: marginal returns'
  fig_announced_water_point_coverage_under_alternative_access_distances:
    figureId: fig_announced_water_point_coverage_under_alternative_access_distances
    figurePath: data/results/figures/Figure_announced_water_point_coverage_under_alternative_access_distances.png
    figureCaption: Existing water-point coverage under alternative access distances
    figureAim: Maps affected resident meshes covered by the 36 existing announced water points under 250, 500, 1,000,
      2,000, and 5,000 m baseline road-network distance assumptions.
    figureExplanation: Maps the same demand and 36 points under five distance thresholds. Spatial expansion reflects
      only the threshold assumption.
    figureSuitableSection: 'Results: access sensitivity'
